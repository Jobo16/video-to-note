name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            url2audio/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -r url2audio/requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Syntax
        run: |
          python -m compileall -q backend url2audio launcher.py
          node --check frontend/script.js
