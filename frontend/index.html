<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoToNo · 链接转字幕</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/script.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <strong>VideoToNo</strong>
      <span>链接转字幕</span>
    </div>
  </header>
  <main class="wrap">
    <section class="panel">
      <h1>把视频变成字幕</h1>
      <p class="intro">粘贴抖音、B 站或 YouTube 链接。服务器先准备音频；取不到时自动由本机下载。语音转录始终在本机完成。</p>
      <form id="transcribe-form">
        <label class="field-label" for="video-url">视频链接或分享文本</label>
        <textarea id="video-url" name="video-url" rows="3" required placeholder="粘贴视频链接或整段分享文本"></textarea>
        <fieldset>
          <legend>视频语言</legend>
          <label class="choice"><input type="radio" name="language" value="zh" checked><span>中文 · Paraformer</span></label>
          <label class="choice"><input type="radio" name="language" value="en"><span>英语 · Whisper small</span></label>
        </fieldset>
        <button type="submit" id="submit-button">开始转录</button>
      </form>
    </section>
    <section class="panel" id="current-panel" hidden>
      <h2>当前任务</h2>
      <p id="current-step" aria-live="polite"></p>
      <div class="progress"><div id="progress-fill"></div></div>
      <div id="current-result"></div>
    </section>
    <section class="panel">
      <h2>最近任务</h2>
      <div id="recent-tasks">正在读取…</div>
    </section>
  </main>
</body>
</html>
