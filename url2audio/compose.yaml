services:
  url2audio:
    build:
      context: ..
      dockerfile: url2audio/Dockerfile
      network: host
      args:
        URL2AUDIO_BUILD_PROXY: http://127.0.0.1:7890
    network_mode: host
    env_file: /opt/stacks/url2audio/.env
    volumes:
      - /opt/stacks/url2audio/data:/data
    restart: unless-stopped
    mem_limit: 1g
